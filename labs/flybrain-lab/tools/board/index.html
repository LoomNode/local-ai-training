<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flybrain lab</title>
<style>
:root{--bg:#0f1115;--panel:#161a22;--line:#262c38;--text:#e6e9ef;--muted:#8b93a7;--accent:#5ab0ff;--plain:#8b93a7;--best:#3ecf8e;--bad:#ff6b6b;
      --table:#4f9cf5;--tier:#c084fc;--match:#3ecf8e;--weights:#f0b35a;--big-a:#3987e5;--big-b:#d95926;--big-c:#199e70;--big-d:#c98500}
@media (prefers-color-scheme: light){:root:not([data-theme=dark]){--bg:#f4f6f9;--panel:#fff;--line:#dde2ea;--text:#1b1f27;--muted:#5d6678;--plain:#6b7386;--big-a:#2a78d6;--big-b:#eb6834;--big-c:#1baf7a;--big-d:#eda100}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.tabs{display:flex;gap:4px}
.tabs button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:5px 14px;border-radius:999px;cursor:pointer;font:inherit}
.tabs button.on{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.muted{color:var(--muted)} .right{margin-left:auto}
main{padding:16px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.big{font-size:20px;font-weight:600}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .6s}
.gpu{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:13px}
.gpu b{color:var(--text);font-weight:600}
.meter{display:inline-block;width:70px;height:6px;background:var(--line);border-radius:3px;vertical-align:middle;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
select,input[type=range],button.btn{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px;max-width:100%}
button.btn{cursor:pointer} button.btn:hover{border-color:var(--accent)}
svg{width:100%;height:auto;display:block}
.axis{stroke:var(--line);stroke-width:1} .tick{fill:var(--muted);font-size:11px}
.ranks{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;font-size:14px}
.ranks .rb{grid-column:1/-1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:-2px 0 4px}
.ranks .rb i{display:block;height:100%;background:var(--best);border-radius:3px}
.ranks .live{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.bytes{font:13px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;user-select:none}
.bytes span{border-radius:2px;padding:1px 0}
.bytes span.off{opacity:.15} .bytes span.cur{outline:2px solid var(--text)}
.tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;max-width:380px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:5}
.tip code{font-family:ui-monospace,monospace;background:var(--line);padding:0 4px;border-radius:3px}
.err{color:var(--bad);font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap}
#bigrows{display:flex;flex-direction:column}
.bigrow{display:flex;flex-wrap:wrap;gap:2px 18px;align-items:baseline;padding:6px 0}
.bigrow + .bigrow{border-top:1px solid var(--line)}
.key{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:0 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill i{display:inline-block;width:8px;height:8px;border-radius:50%}
#bigchart{touch-action:pan-y}
#bigchart:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.legend.small{font-size:13px;color:var(--muted);margin-top:6px}
svg.k{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:6px}
.tablewrap{overflow-x:auto;margin-top:6px}
.bigtab{border-collapse:collapse;font-size:13px;min-width:100%}
.bigtab caption{text-align:left;color:var(--muted);padding:6px 0}
.bigtab th,.bigtab td{padding:3px 12px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.bigtab th{color:var(--muted);font-weight:600}
.tip .tiphead{color:var(--muted);margin-bottom:4px}
.tip .tiprun{margin-top:6px;font-weight:600}
.tip .tiprow{display:flex;gap:8px;white-space:nowrap}
.tip .tiprow b{min-width:3.6em;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:600px){main{padding:12px} header{padding:8px 12px;gap:10px} .bytes{font-size:12px} .big{font-size:17px}}
</style>
</head>
<body>
<header>
  <strong>flybrain lab</strong>
  <nav class="tabs"><button data-tab="train" class="on">Training</button><button data-tab="read">Reading</button></nav>
  <span id="status" class="muted right"></span>
</header>
<main>
<section id="train">
  <div class="card" id="bigcard" hidden>
    <h3>Big train — open-ended runs, no end step</h3>
    <div id="bigrows"></div>
    <div class="row" style="margin-top:10px"><span class="muted">bits per byte — lower is better</span><label class="muted right">x axis <select id="bigx"><option value="lin">training steps</option><option value="log">training steps, log scale</option></select></label></div>
    <svg id="bigchart" viewBox="0 0 860 340" tabindex="0" role="img" aria-label="bits per byte against training steps for the big runs; the left and right arrow keys step through the checkpoints"></svg>
    <div class="legend small" id="biglegend"></div>
    <details id="bigtable" style="margin-top:8px"><summary class="muted" style="cursor:pointer">the numbers</summary><div id="bigtablebody" class="tablewrap"></div></details>
  </div>
  <div class="card" id="runcard"><div class="muted">loading…</div></div>
  <div class="card">
    <h3>How surprised the model is by each byte — lower is better</h3>
    <svg id="curve" viewBox="0 0 860 330" aria-label="surprise per byte against training steps"></svg>
    <div class="row" style="margin-top:6px"><span id="verdict"></span><label class="muted right">also show <select id="ref"></select></label></div>
  </div>
  <div class="card"><h3>Best runs so far — how much less surprised than the plain transformer</h3><div class="ranks" id="ranks"></div></div>
</section>
<section id="read" hidden>
  <div class="card row">
    <label>model <select id="model"></select></label>
    <label>file <select id="win"></select></label>
    <button class="btn" id="play">▶ watch it read</button>
    <label class="muted">speed <input type="range" id="speed" min="2" max="400" value="60"></label>
    <span id="counter" class="muted right"></span>
  </div>
  <div class="card"><div id="summary" style="font-size:16px;margin-bottom:8px"></div><div class="legend" id="legend"></div></div>
  <div class="card"><div id="bytes" class="bytes"></div></div>
</section>
</main>
<div id="tip" class="tip" hidden></div>
<script>
const $ = s => document.querySelector(s);
const pct = x => x == null || Number.isNaN(x) ? "–" : Math.round(x) + " %";
const fmtDur = s => { if (s == null) return "–"; s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h} h ${String(m).padStart(2, "0")} min` : `${m} min`; };
const clock = s => new Date(Date.now() + s * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const SRC = { table: ["remembered from the corpus table", "var(--table)"], tier: ["remembered from this project's files", "var(--tier)"],
              match: ["copied from earlier in the file", "var(--match)"], weights: ["worked out by the network", "var(--weights)"] };

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("#train").hidden = b.dataset.tab !== "train"; $("#read").hidden = b.dataset.tab !== "read";
  try { localStorage.setItem("tab", b.dataset.tab); } catch (e) {}
});
try { const t = new URLSearchParams(location.search).get("tab") || localStorage.getItem("tab"); if (t) document.querySelector(`.tabs button[data-tab=${t}]`)?.click(); } catch (e) {}

// ---------------- Training ----------------
let state = null;
const curves = {};
async function curve(name) {
  if (!name) return null;
  if (!(name in curves)) { try { curves[name] = await (await fetch("/api/curve/" + encodeURIComponent(name))).json(); } catch (e) { curves[name] = null; } }
  return curves[name] && curves[name].points ? curves[name] : null;
}
async function poll() {
  try {
    const r = await fetch("/api/state"); state = await r.json();
    $("#status").textContent = new Date(state.time * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    try { renderBig(); } catch (e) { console.error("big train panel", e); }
    renderRun(); renderRanks(); fillRefs(); fillWindows(); await drawCurve();
  } catch (e) { $("#status").textContent = "board unreachable"; }
}
function gpuLine(g) {
  const who = g.holders.length ? g.holders.map(h => h.who.replace(/\.service$/, "")).join(", ") : g.util > 20 ? "your game" : "idle";
  return `<div class="gpu"><b>GPU ${g.index}</b><span>${esc(who)}</span><span class="meter"><i style="width:${Math.min(100, g.util)}%"></i></span><span>${Math.round(g.util)} %</span><span>${Math.round(g.power_w)} W</span><span>${Math.round(g.temp_c)} °C</span></div>`;
}
function renderRun() {
  const live = state.runs[0], bigUp = !!state.big && Object.values(state.big).some(b => b.running);
  let html = "";
  if (live) {
    const p = live.points, last = p[p.length - 1], step = last ? last.step : 0, frac = live.budget ? step / live.budget : 0;
    html += `<div class="muted">Training now</div><div class="big">${esc(live.label)}</div>`;
    if (live.open_ended) html += `<div>open-ended, no end step${step ? ` · ${step.toLocaleString()} steps so far` : " · just started"}${live.pace ? ` · ${live.pace.toFixed(2)} s per step` : ""}</div>`;
    else html += `<div class="bar"><i style="width:${(100 * frac).toFixed(1)}%"></i></div>
      <div>${pct(100 * frac)} done${live.eta_s != null ? ` · about ${fmtDur(live.eta_s)} left, finishing around ${clock(live.eta_s)}` : " · just started"}${step ? ` · ${step.toLocaleString()} of ${live.budget.toLocaleString()} steps` : ""}</div>`;
    if (live.errors.length) html += `<div class="err">${esc(live.errors.join("\n"))}</div>`;
    if (state.runs.length > 1) html += `<div class="muted">also running: ${state.runs.slice(1).map(r => esc(r.label)).join(", ")}</div>`;
  } else if (state.last) {
    html += `<div class="muted">${bigUp ? "Nothing in the queue (the big train is running). Last finished" : "Nothing training. Last finished"}</div><div class="big">${esc(state.last.label)}</div><div class="muted">${fmtDur(state.last.train_s)} of training</div>`;
  } else html += `<div class="big muted">${bigUp ? "Nothing in the queue" : "Nothing training"}</div>`;
  html += `<div style="margin-top:10px;display:flex;flex-direction:column;gap:4px">${state.gpus.map(gpuLine).join("")}</div>`;
  $("#runcard").innerHTML = html;
}
function renderRanks() {
  const seen = new Set(), rows = state.leaderboard.filter(r => r.run && !seen.has(r.run) && seen.add(r.run)).slice(0, 8);
  const plain = state.plain_cold, best = rows.length ? rows[0].cold : plain, live = new Set(state.runs.map(r => r.name));
  $("#ranks").innerHTML = rows.map(r => {
    const gain = 100 * (plain - r.cold) / plain, w = Math.max(2, 100 * (plain - r.cold) / (plain - best));
    return `<span class="${live.has(r.run) ? "live" : ""}">${esc(r.label)}</span><span>${gain.toFixed(0)} %</span><span class="rb"><i style="width:${w.toFixed(0)}%"></i></span>`;
  }).join("") + `<span class="muted">plain transformer, no memory</span><span class="muted">0 %</span><span class="rb"></span>`;
}
function fillRefs() {
  const sel = $("#ref"); if (sel.options.length) return;
  sel.innerHTML = `<option value="">nothing else</option>` + state.runs_available.map(r => `<option value="${esc(r.name)}">${esc(r.label)}</option>`).join("");
  sel.onchange = drawCurve;
}
async function drawCurve() {
  const live = state.runs[0] || state.last;
  const plain = await curve(state.plain_run), best = await curve(state.best_run), extra = await curve($("#ref").value);
  const series = [];
  if (plain) series.push({ name: "plain transformer, no memory", pts: plain.points, color: "var(--plain)", dash: "6 5" });
  if (best && state.best_run !== (live && live.name)) series.push({ name: "best so far: " + best.label, pts: best.points, color: "var(--best)", dash: "" });
  if (extra && ![state.plain_run, state.best_run, live && live.name].includes($("#ref").value)) series.push({ name: extra.label, pts: extra.points, color: "var(--tier)", dash: "2 4" });
  if (live && live.points.length) series.push({ name: "this run", pts: live.points, color: "var(--accent)", dash: "", budget: live.open_ended ? null : live.budget, width: 2.6 });
  const svg = $("#curve"), W = 860, H = 330, L = 46, R = 16, T = 12, B = 30;
  if (!series.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" class="tick" text-anchor="middle">no curve yet</text>`; $("#verdict").textContent = ""; return; }
  const xmax = Math.max(...series.map(s => Math.max(s.budget || 0, s.pts[s.pts.length - 1].step)));
  const ys = series.flatMap(s => s.pts.map(p => p.bpb)).filter(v => v < 1.6);
  let ymin = Math.min(...ys), ymax = Math.max(...ys); const pad = Math.max(0.03, (ymax - ymin) * 0.1); ymin -= pad; ymax += pad;
  const X = s => L + (W - L - R) * s / xmax, Y = v => T + (H - T - B) * (1 - (Math.min(v, ymax) - ymin) / (ymax - ymin));
  let g = "";
  for (const v of ticks(ymin, ymax, 5)) g += `<line class="axis" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tick" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v.toFixed(2)}</text>`;
  for (const v of ticks(0, xmax, 6)) g += `<text class="tick" x="${X(v)}" y="${H - B + 16}" text-anchor="middle">${v >= 1000 ? Math.round(v / 1000) + "k" : v}</text>`;
  g += `<text class="tick" x="${W - R}" y="${H - 3}" text-anchor="end">training steps</text>`;
  for (const s of series) {
    g += `<path d="${s.pts.map((p, i) => `${i ? "L" : "M"}${X(p.step).toFixed(1)},${Y(p.bpb).toFixed(1)}`).join(" ")}" fill="none" stroke="${s.color}" stroke-width="${s.width || 1.8}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""}/>`;
    const last = s.pts[s.pts.length - 1];
    g += `<circle cx="${X(last.step)}" cy="${Y(last.bpb)}" r="3.5" fill="${s.color}"/>`;
    if (s.budget && s.budget > last.step) g += `<line x1="${X(s.budget)}" x2="${X(s.budget)}" y1="${T}" y2="${H - B}" stroke="${s.color}" stroke-dasharray="2 4" opacity=".5"/>`;
  }
  g += series.map((s, i) => `<text class="tick" x="${L + 8}" y="${T + 14 + 15 * i}" style="fill:${s.color}">— ${esc(s.name)}</text>`).join("");
  svg.innerHTML = g;
  let v = "";
  if (live && live.points.length) {
    const now = live.points[live.points.length - 1].bpb;
    if (plain) { const pf = plain.points[plain.points.length - 1].bpb; v += now < pf ? `Already <b>${pct(100 * (pf - now) / pf)} less surprised</b> than the plain transformer was at the end of its hour.` : `Still ${pct(100 * (now - pf) / pf)} more surprised than the plain transformer's finish.`; }
    if (best && best.points.length && state.best_run !== live.name) { const bf = best.points[best.points.length - 1].bpb; v += now > bf ? ` ${pct(100 * (now - bf) / bf)} above the best run's finish.` : ` <b>Below the best run's finish.</b>`; }
  }
  $("#verdict").innerHTML = v;
}
function ticks(a, b, n) { const raw = (b - a) / n; if (!(raw > 0)) return []; const mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag, st = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag; const out = []; for (let v = Math.ceil(a / st) * st; v <= b + 1e-9; v += st) out.push(+v.toFixed(6)); return out; }

// ---------------- Big train ----------------
// Colour follows the run: big12 is always blue, big8 always orange (two slots of the validated categorical palette), whatever else is running.
const BIGCOL = { big12: "var(--big-a)", big8: "var(--big-b)" }, BIGMORE = ["var(--big-c)", "var(--big-d)"];
const bigColor = (name, i) => BIGCOL[name] || BIGMORE[Math.max(0, i - 2) % BIGMORE.length];
const BIGSTATE = { running: ["var(--best)", "running"], paused: ["var(--weights)", "paused for the game"], stopped: ["var(--bad)", "stopped"], "not started": ["var(--muted)", "not started"] };
// The scorer's tags, as marks: shape says which windows, filled or hollow says which table (the training table or the bigger 2^30 one).
const BIGMARKS = [
  { tag: "dev", shape: "dot", hollow: false, label: "clean dev windows" },
  { tag: "dev30", shape: "dot", hollow: true, label: "clean dev windows, read through the 2^30 table" },
  { tag: "oldk", shape: "diamond", hollow: false, label: "clean old-kernel windows" },
  { tag: "oldk30", shape: "diamond", hollow: true, label: "clean old-kernel windows, read through the 2^30 table" },
];
const fmtStep = v => v >= 1e6 ? +(v / 1e6).toFixed(2) + "M" : v >= 1000 ? +(v / 1000).toFixed(1) + "k" : String(v);
const fmtPasses = v => v < 1 ? v.toFixed(3) : v.toFixed(2);
const bpbs = (v, d = 3) => v == null ? "–" : v.toFixed(d);
let bigModel = null, bigHover = null;
try { const x = localStorage.getItem("bigx"); if (x === "log" || x === "lin") $("#bigx").value = x; } catch (e) {}
$("#bigx").onchange = () => { try { localStorage.setItem("bigx", $("#bigx").value); } catch (e) {} if (state) { drawBig(Object.values(state.big || {})); } };
let bigResize = 0;
window.addEventListener("resize", () => { cancelAnimationFrame(bigResize); bigResize = requestAnimationFrame(() => { if (state && state.big && !$("#bigcard").hidden) drawBig(Object.values(state.big)); }); });

function renderBig() {
  if (state.big_error) {  // the server could not read the big train's files: say so here, the rest of the page is unaffected
    $("#bigcard").hidden = false; $("#bigrows").innerHTML = `<div class="err">${esc(state.big_error)}</div>`;
    $("#bigchart").innerHTML = ""; $("#biglegend").innerHTML = ""; $("#bigtablebody").innerHTML = ""; bigModel = null;
    return;
  }
  const runs = state.big ? Object.values(state.big) : [];
  const quiet = runs.every(r => r.state === "not started" && !r.waiting);  // nothing started and nothing waiting for a card: no panel
  $("#bigcard").hidden = !runs.length || quiet;
  if (!runs.length || quiet) return;
  $("#bigrows").innerHTML = runs.map((r, i) => bigRow(r, bigColor(r.name, i))).join("");
  drawBig(runs); bigTable(runs);
}
function bigRow(r, col) {
  const [dot, txt] = BIGSTATE[r.state] || ["var(--muted)", r.state];
  const dev = (r.clean && r.clean.dev) || [], last = dev[dev.length - 1];
  const fact = [];
  if (r.step != null) fact.push(`step <b>${r.step.toLocaleString()}</b>`, `${fmtPasses(r.passes)} passes`);
  if (r.pace) fact.push(`${r.pace.toFixed(2)} s per step`);
  fact.push(last ? `clean dev <b>${bpbs(last[1])}</b> <span class="muted">at ${last[0].toLocaleString()}</span>` : `<span class="muted">no clean score yet</span>`);
  const notes = ["open-ended" + (r.running && r.passes_per_day ? `, about ${r.passes_per_day.toFixed(1)} passes a day` : "")];
  if (r.layers) notes.push(`${r.layers} layers`);
  if (r.train_s) notes.push(`trained ${fmtDur(r.train_s)} so far`);
  if (r.waiting) notes.push(r.state === "paused" ? "the supervisor restarts it when the card is free" : "waiting for the card");
  if (r.restarts) notes.push(`resumed ${r.restarts} time${r.restarts > 1 ? "s" : ""}`);
  if (r.log_age_s != null) notes.push(`log ${r.log_age_s < 90 ? "just now" : fmtDur(r.log_age_s) + " ago"}`);
  return `<div class="bigrow"><span><span class="key" style="border-color:${col}"></span><b>${esc(r.name)}</b></span>
    <span class="pill"><i style="background:${dot}"></i>${esc(txt)}</span>${fact.map(f => `<span>${f}</span>`).join("")}<span class="muted">${notes.map(esc).join(" · ")}</span></div>`;
}
function markSvg(m, x, y, col, r = 4) {  // a filled mark carries a 2px ring in the surface colour; a hollow one is an outline in the run's colour,
  // a little larger, so that where the 2^30 reading lies near the training-table one (it usually does) the ring still shows around the dot
  const fill = m.hollow ? "none" : col, line = m.hollow ? `stroke="${col}" stroke-width="2"` : `stroke="var(--panel)" stroke-width="4" paint-order="stroke"`;
  if (m.hollow) r += 1.5;
  if (m.shape === "dot") return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${fill}" ${line}/>`;
  const d = r + 1;
  return `<path d="M${x.toFixed(1)},${(y - d).toFixed(1)}L${(x + d).toFixed(1)},${y.toFixed(1)}L${x.toFixed(1)},${(y + d).toFixed(1)}L${(x - d).toFixed(1)},${y.toFixed(1)}Z" fill="${fill}" ${line} stroke-linejoin="round"/>`;

function drawBig(runs) {
  // the viewBox is the chart's real width in pixels, so the text keeps its size on a phone instead of shrinking with the drawing
  const svg = $("#bigchart"), cw = svg.getBoundingClientRect().width, W = cw > 0 ? Math.max(320, Math.round(cw)) : 860, narrow = W < 600;
  const H = narrow ? 300 : 340, L = narrow ? 40 : 48, R = narrow ? 50 : 58, T = 14, B = 34, logx = $("#bigx").value === "log";
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const ser = runs.map((r, i) => ({ r, col: bigColor(r.name, i), curve: (r.curve || []).filter(p => p[1] != null),
    tags: BIGMARKS.map(m => ({ m, pts: ((r.clean || {})[m.tag] || []).filter(p => p[1] != null) })) }));
  const all = ser.flatMap(s => [...s.curve, ...s.tags.flatMap(t => t.pts)]);
  if (!all.length) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" class="tick" text-anchor="middle">no curve yet</text>`; $("#biglegend").innerHTML = ""; bigModel = null; return; }
  const xmax = Math.max(...all.map(p => p[0])), xlo = 1000, vals = all.map(p => p[1]).sort((a, b) => a - b);
  // the early steep part does not set the scale once there are many points: the top 3 % of the values may run off the plot (clipped, not squeezed)

  const clash = ends.some((a, i) => ends.some((b, j) => i < j && Math.abs(a.x - b.x) < 70 && Math.abs(a.y - b.y) < 15));
  if (!clash) for (const e of ends) g += `<text class="tick" style="font-weight:600;stroke:var(--panel);stroke-width:4px;paint-order:stroke" x="${(e.x + 10).toFixed(1)}" y="${(e.y + 4).toFixed(1)}">${esc(e.s.r.name)}</text>`;
  g += `<line id="bigcross" y1="${T}" y2="${T + PH}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  svg.innerHTML = g;
  const steps = [...new Set(all.map(p => p[0]))].sort((a, b) => a - b);
  bigModel = { W, X, ser, steps };
  if (bigHover != null && steps.includes(bigHover)) bigCross(bigHover);
  // the legend: the runs by colour, then the marks by shape (only those with data), in ink
  const win = tag => { for (const s of ser) if (s.r.windows && s.r.windows[tag]) return ` (${s.r.windows[tag]})`; return ""; };
  const key = (inner) => `<svg class="k" viewBox="0 0 16 16" aria-hidden="true">${inner}</svg>`;
  $("#biglegend").innerHTML = ser.map(s => `<span><span class="key" style="border-color:${s.col}"></span>${esc(s.r.name)}</span>`).join("") +
    `<span>${key(`<path d="M0,8H16" stroke="var(--muted)" stroke-width="1.6"/>`)}in-run curve, 128 fixed windows</span>` +
    BIGMARKS.filter(m => ser.some(s => s.tags.find(t => t.m.tag === m.tag).pts.length)).map(m => `<span>${key(markSvg(m, 8, 8, "var(--muted)", 4))}${m.label}${win(m.tag)}</span>`).join("");

function bigCross(step) {
  const c = $("#bigcross"); if (!c || !bigModel) return;
  c.setAttribute("x1", bigModel.X(step).toFixed(1)); c.setAttribute("x2", bigModel.X(step).toFixed(1)); c.setAttribute("visibility", "visible");
}
function bigShow(step, cx, cy) {
  if (!bigModel) return;
  bigHover = step; bigCross(step);
  const tip = $("#tip"), el = (tag, txt, cls) => { const e = document.createElement(tag); if (txt != null) e.textContent = txt; if (cls) e.className = cls; return e; };
  tip.replaceChildren();

  tip.append(el("div", `step ${step.toLocaleString()}${any ? ` · ${fmtPasses(step * any.r.passes_per_step)} passes` : ""}`, "tiphead"));
  for (const s of bigModel.ser) {

    if (c) rows.push(["in-run curve", c[1], c[2]]);
    for (const t of s.tags) { const p = t.pts.find(q => q[0] === step); if (p) rows.push([t.m.label.replace("clean ", "").replace(", read through the 2^30 table", " through 2^30"), p[1], p[2]]); }

    const head = el("div", null, "tiprun"), k = el("span", null, "key"); k.style.borderColor = s.col; head.append(k, document.createTextNode(s.r.name)); tip.append(head);
    for (const [name, cold, warm] of rows) { const row = el("div", null, "tiprow"); row.append(el("b", bpbs(cold, 4)), el("span", name), el("span", warm != null ? `warm ${bpbs(warm, 4)}` : "", "muted")); tip.append(row); }
  }

  tip.style.top = Math.max(8, Math.min(cy + 16, window.innerHeight - tip.offsetHeight - 8)) + "px";

function bigHide() { bigHover = null; $("#tip").hidden = true; const c = $("#bigcross"); if (c) c.setAttribute("visibility", "hidden"); }
(function () {
  const svg = $("#bigchart");
  const nearest = vx => bigModel.steps.reduce((b, s) => Math.abs(bigModel.X(s) - vx) < Math.abs(bigModel.X(b) - vx) ? s : b, bigModel.steps[0]);
  svg.addEventListener("pointermove", ev => { if (!bigModel) return; const r = svg.getBoundingClientRect(); bigShow(nearest((ev.clientX - r.left) * bigModel.W / r.width), ev.clientX, ev.clientY); });
  svg.addEventListener("pointerleave", bigHide);
  svg.addEventListener("blur", bigHide);
  const at = step => { const r = svg.getBoundingClientRect(); bigShow(step, r.left + bigModel.X(step) * r.width / bigModel.W, r.top + 24); };
  svg.addEventListener("focus", () => { if (bigModel && svg.matches(":focus-visible")) at(bigHover != null ? bigHover : bigModel.steps[bigModel.steps.length - 1]); });  // keyboard focus only: a click is not a request for a tooltip
  svg.addEventListener("keydown", ev => {
    if (!bigModel) return; const st = bigModel.steps, i = bigHover == null ? st.length - 1 : st.indexOf(bigHover);
    const j = ev.key === "ArrowLeft" ? i - 1 : ev.key === "ArrowRight" ? i + 1 : ev.key === "Home" ? 0 : ev.key === "End" ? st.length - 1 : null;
    if (j == null) return; ev.preventDefault(); at(st[Math.max(0, Math.min(st.length - 1, j))]);
  });
})();
function bigTable(runs) {  // the same numbers without hovering: the newest checkpoints of each run, bits per byte
  const NEWEST = 30;
  $("#bigtablebody").innerHTML = runs.map(r => {
    const by = new Map(), put = (step, k, v) => { if (!by.has(step)) by.set(step, {}); by.get(step)[k] = v; };
    (r.curve || []).forEach(p => put(p[0], "curve", p[1]));
    BIGMARKS.forEach(m => ((r.clean || {})[m.tag] || []).forEach(p => { put(p[0], m.tag, p[1]); if (m.tag === "dev") put(p[0], "devwarm", p[2]); }));
    const steps = [...by.keys()].sort((a, b) => b - a), shown = steps.slice(0, NEWEST), cols = BIGMARKS.filter(m => steps.some(s => by.get(s)[m.tag] != null));
    if (!steps.length) return "";
    const head = `<tr><th>step</th><th>passes</th><th>in-run curve</th>${cols.map(m => `<th>${esc(m.tag)}${m.tag === "dev" ? "</th><th>dev warm" : ""}</th>`).join("")}</tr>`;
    const rows = shown.map(s => { const v = by.get(s); return `<tr><td>${s.toLocaleString()}</td><td>${fmtPasses(s * r.passes_per_step)}</td><td>${bpbs(v.curve, 4)}</td>${cols.map(m => `<td>${bpbs(v[m.tag], 4)}</td>${m.tag === "dev" ? `<td>${bpbs(v.devwarm, 4)}</td>` : ""}`).join("")}</tr>`; });

// ---------------- Reading ----------------
let win = null, attr = null, right = null, playing = false, cursor = 0, timer = null;
const MODEL = { l4dir: "4 layers + corpus table + project tier (the best at one hour)", l4b: "4 layers + corpus table", l4plainm: "4 layers, no corpus table", l4dist: "4 layers, no corpus table, taught by the table model" };
function fillWindows() {
  const msel = $("#model"); if (msel.options.length || !state.windows.length) return;
  const order = ["l4dir", "l4b", "l4dist", "l4plainm"], models = [...new Set(state.windows.map(w => w.model))].sort((a, b) => (order.indexOf(a) + 99) % 100 - (order.indexOf(b) + 99) % 100);
  msel.innerHTML = models.map(m => `<option value="${esc(m)}">${esc(MODEL[m] || m)}</option>`).join("");
  msel.onchange = () => { fillWins(); loadWindow(); };
  $("#win").onchange = loadWindow; $("#play").onclick = () => playing ? stopPlay() : startPlay();
  $("#speed").oninput = () => { if (playing) { stopTimer(); startTimer(); } };
  fillWins(); loadWindow();
}
function fillWins() {
  const m = $("#model").value, ws = state.windows.filter(w => w.model === m).sort((a, b) => a.window - b.window), cur = $("#win").value;
  $("#win").innerHTML = ws.map(w => `<option value="${esc(w.file)}">${esc(w.head.includes("/") ? w.head.split("/").slice(-2).join("/") : "…" + w.head.slice(0, 28))}</option>`).join("");
  const same = ws.find(w => w.file.endsWith(cur.replace(/^[^_]+_/, "_"))); if (same) $("#win").value = same.file;
}
async function loadWindow() {
  stopPlay(); const f = $("#win").value; if (!f) return;
  try { win = await (await fetch("/api/window/" + encodeURIComponent(f))).json(); } catch (e) { $("#bytes").textContent = "could not load " + f; return; }
  attribute(); paint();
}
function attribute() {
  const c = win.cost, T = win.T, full = c.full; attr = new Array(T); right = new Array(T);
  for (let i = 0; i < T; i++) {
    const dt = c.tables_off ? c.tables_off[i] - full[i] : -1, dtier = c.tier_off ? c.tier_off[i] - full[i] : -1, dm = c.match_off ? c.match_off[i] - full[i] : -1;
    let src = "weights";
    if (dtier >= 0.25 && dtier >= 0.5 * dt && dtier >= dm) src = "tier"; else if (dt >= 0.25 && dt >= dm) src = "table"; else if (dm >= 0.25) src = "match";
    attr[i] = src; right[i] = win.top3 ? win.top3[i][0] === win.text.charCodeAt(i) : null;
  }
}
const rep = b => b === 10 ? "newline" : b === 9 ? "tab" : b === 32 ? "space" : (b < 32 || b > 126) ? "byte " + b : `<code>${esc(String.fromCharCode(b))}</code>`;
function paint() {
  const T = win.T, full = win.cost.full, text = win.text, parts = [];
  for (let i = 0; i < T; i++) {
    const ch = text[i], code = text.charCodeAt(i), a = Math.max(0.1, Math.min(1, full[i] / 4));
    const shown = ch === "\n" ? "↵" : ch === "\t" ? "⇥" : (code < 32 || code === 127) ? "·" : ch === " " ? " " : esc(ch);
    parts.push(`<span data-i="${i}" style="background:color-mix(in srgb,${SRC[attr[i]][1]} ${Math.round(a * 100)}%,transparent)">${shown}</span>${ch === "\n" ? "<br>" : ""}`);
  }
  $("#bytes").innerHTML = parts.join("");
  const n = {}; let ok = 0;
  for (let i = 0; i < T; i++) { n[attr[i]] = (n[attr[i]] || 0) + 1; if (right[i]) ok++; }
  const share = k => Math.round(100 * (n[k] || 0) / T);
  const mem = share("table") + share("tier") + share("match");
  const present = Object.keys(SRC).filter(k => k === "weights" || n[k]);
  const parts2 = [];
  if (n.table) parts2.push(`<b style="color:var(--table)">${share("table")} %</b> from the corpus table`);
  if (n.tier) parts2.push(`<b style="color:var(--tier)">${share("tier")} %</b> from this project's other files`);
  if (n.match) parts2.push(`<b style="color:var(--match)">${share("match")} %</b> copied from earlier in the file`);
  $("#summary").innerHTML = `The model guessed <b>${Math.round(100 * ok / T)} %</b> of these ${T.toLocaleString()} bytes right. ` +
    (mem ? `<b>${mem} %</b> of the bytes came from memory (${parts2.join(", ")}); the network worked out the other <b style="color:var(--weights)">${share("weights")} %</b>.` : `It has no corpus table: the network worked out <b style="color:var(--weights)">${share("weights")} %</b> on its own.`);
  $("#legend").innerHTML = present.map(k => `<span><i style="background:${SRC[k][1]}"></i>${SRC[k][0]}</span>`).join("") + `<span class="muted">brighter = harder byte</span>`;
  $("#counter").textContent = "";

  box.onmousemove = ev => {

    const i = +sp.dataset.i, b = win.cost.full[i], t3 = win.top3 && win.top3[i], ease = b < 0.5 ? "sure of it" : b < 2 ? "not sure" : "a hard one";
    let h = `${rep(text.charCodeAt(i))} — ${SRC[attr[i]][0]}, `;
    h += right[i] ? `guessed right (${ease})` : right[i] === false ? `guessed ${rep(t3[0])} instead — wrong (${ease})` : ease;
    tip.innerHTML = h; tip.hidden = false;
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 400) + "px"; tip.style.top = (ev.clientY + 18 > window.innerHeight - 80 ? ev.clientY - 60 : ev.clientY + 18) + "px";
  };
  box.onmouseleave = () => tip.hidden = true;
}
function startPlay() {
  if (!win) return; playing = true; $("#play").textContent = "❚❚ pause";
  if (cursor >= win.T) cursor = 0;
  $("#bytes").querySelectorAll("span[data-i]").forEach((s, i) => s.classList.toggle("off", i >= cursor));
  startTimer();
}
function startTimer() { const rate = +$("#speed").value, every = Math.max(16, 1000 / rate), per = Math.max(1, Math.round(rate * every / 1000)); timer = setInterval(() => { cursor = Math.min(win.T, cursor + per); applyCursor(); if (cursor >= win.T) stopPlay(true); }, every); }
function stopTimer() { if (timer) clearInterval(timer); timer = null; }
function stopPlay(done) {

}
function applyCursor() {

  const cur = spans[cursor - 1]; if (cur) { const r = cur.getBoundingClientRect(); if (r.bottom > window.innerHeight - 40 || r.top < 60) cur.scrollIntoView({ block: "center", behavior: "smooth" }); }
  $("#counter").textContent = `${cursor.toLocaleString()} of ${win.T.toLocaleString()} bytes read · ${Math.round(100 * ok / Math.max(1, cursor))} % guessed right so far`;
}

poll(); setInterval(poll, 5000);
</script>
