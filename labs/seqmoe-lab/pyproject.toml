[project]
name = "seqmoe-lab"
version = "0.1.0"
description = "Sequential Mixture-of-Experts PoC — frozen trunk, one expert at a time"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
